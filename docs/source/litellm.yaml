# laguna-bench LiteLLM gateway (local, 127.0.0.1:4000). Single route: laguna-s-2.1 -> vLLM via the SSH tunnel.
# Used only if vLLM's native Anthropic /v1/messages endpoint mishandles tool use or thinking.
model_list:
  - model_name: laguna-s-2.1
    litellm_params:
      model: hosted_vllm/laguna-s-2.1
      api_base: http://127.0.0.1:18000/v1
      api_key: dummy-local
      timeout: 1800
litellm_settings:
  drop_params: true
  telemetry: false
general_settings:
  master_key: dummy-local
