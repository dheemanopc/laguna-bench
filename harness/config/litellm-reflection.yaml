# laguna-bench LiteLLM gateway for Reflection's first-party Beam API (OpenAI chat-completions only).
# Claude Code (Anthropic /v1/messages) -> shim :4003 -> LiteLLM :4010 -> https://api.reflection.ai/openai/v1
# Key comes from env REFLECTION_API_KEY (read from ~/laguna-bench/.reflection_key at launch; never inline it).
model_list:
  - model_name: beam-1.0
    litellm_params:
      model: hosted_vllm/Beam-1.0-501B-A23B
      api_base: https://api.reflection.ai/openai/v1
      api_key: os.environ/REFLECTION_API_KEY
      timeout: 1800
  - model_name: "*"
    litellm_params:
      model: hosted_vllm/Beam-1.0-501B-A23B
      api_base: https://api.reflection.ai/openai/v1
      api_key: os.environ/REFLECTION_API_KEY
      timeout: 1800
litellm_settings:
  drop_params: true
  telemetry: false
general_settings:
  master_key: dummy-local
